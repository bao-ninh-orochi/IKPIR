[package]
name        = "ikpir-server"
description = "Server-side IKPIR protocol: per-segment Index-PIR setup, answer, incremental hint patching, and full rebuild"
keywords    = ["pir", "keyword-pir", "frodopir", "lwe", "incremental"]
categories  = ["cryptography", "data-structures"]
readme      = "README.md"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
license.workspace      = true

autobenches = false

[lints]
workspace = true

[dependencies]
segmented-cuckoo = { workspace = true }
rand             = { workspace = true }
rand_chacha      = { workspace = true }

[dev-dependencies]
proptest     = { workspace = true }
ikpir-client = { workspace = true }
clap         = { workspace = true }
criterion    = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name    = "setup_latency"
harness = false

[[bench]]
name    = "answer_throughput"
harness = false

[[bench]]
name    = "incremental_vs_rebuild"
harness = false

[[bench]]
name    = "end_to_end_fpr"
harness = false

[[bench]]
name    = "failure_modes"
harness = false

[[bench]]
name    = "wire_sizes"
harness = false

[[bench]]
name    = "setup_to_first_query"
harness = false

[[bench]]
name    = "steady_state_workload"
harness = false
