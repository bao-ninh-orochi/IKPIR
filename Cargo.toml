[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.85"
authors      = ["Bao Ninh <bao.ninh@orochi.network>"]
repository   = "https://github.com/orochi-network/IKPIR"
license      = "MIT OR Apache-2.0"
# Paper-companion code, pre-release: nothing is published to crates.io yet.
# Flip deliberately once the paper is out and crate naming is final.
publish      = false

[workspace.dependencies]
segmented-cuckoo = { path = "crates/segmented-cuckoo", version = "0.1" }
# perf/optimized branch: default features stay ON for the intra-workspace
# ikpir-* deps so the (default) `parallel` feature flows into every bench,
# test, and example. main pins default-features = false here.
ikpir-common     = { path = "crates/ikpir-common",     version = "0.1" }
ikpir-server     = { path = "crates/ikpir-server",     version = "0.1" }
ikpir-client     = { path = "crates/ikpir-client",     version = "0.1" }
clap         = { version = "4", features = ["derive"] }
criterion    = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
rand         = "0.9"
rand_chacha  = "0.9"
rayon        = "1"
xxhash-rust  = { version = "0.8", features = ["xxh3"] }
proptest     = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `missing_docs` is opt-in per crate (see each `lib.rs`). Enforcing it at the
# workspace level warns on tests, examples, and Phase B/C stubs, which adds
# noise during scaffolding. Each library re-enables it locally.

[workspace.lints.clippy]
todo      = "warn"
dbg_macro = "warn"
# `unwrap_used`, `expect_used`, and `panic` are intentionally left at default
# level: they fire extensively in benches, tests, and examples where panics on
# invariant violations are idiomatic. Individual library modules can opt in
# locally with `#![warn(clippy::unwrap_used)]` if stricter hygiene is needed.
#
# `clippy::nursery` is not enabled by default. A handful of nursery lints are
# intentional patterns / false-positives here; they are silenced with scoped
# `#![allow(...)]` attributes (which outrank a CLI `-W clippy::nursery`, unlike
# Cargo `[lints]` entries) at each site — see `crates/segmented-cuckoo/src/lib.rs`
# (while_float, option_if_let_else) and the bench files (significant_drop_
# tightening, cognitive_complexity).

[profile.release]
lto           = "fat"
codegen-units = 1
debug         = false

[profile.bench]
inherits = "release"
debug    = true
