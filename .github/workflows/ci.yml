name: CI

on:
  pull_request:
    branches: [main, master, feature/**]
  push:
    branches: [main, master]

# Cancel superseded runs on the same ref so a rapid push sequence does not sit
# in the queue behind its own stale jobs. Inherited from orochi-network/IKPIR
# main, where it protects the shared self-hosted pool; kept here because it is
# good hygiene on the GitHub-hosted fleet too.
#
# `runs-on` deliberately stays `ubuntu-latest` on this branch, where main uses
# `orochi-runners`: that label belongs to the orochi-network org and resolves to
# no runner at all on this personal fork, so a job asking for it would queue
# until it timed out. Do not "sync" it back when merging main in.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      # No `cc` guard here: `cargo fmt` parses, it never compiles or links.
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This workspace is pure Rust (no `cc` build scripts anywhere in Cargo.lock),
      # but rustc still invokes `cc` as its linker driver, and `--all-targets` links
      # the proc-macro cdylibs (syn, serde_derive, clap_derive). The self-hosted
      # orochi-runners image ships no gcc, so install it if it isn't there.
      - name: Ensure C toolchain (cc) — the self-hosted orochi-runners image ships no gcc
        shell: bash
        run: |
          if command -v cc >/dev/null 2>&1; then echo "cc already present"; exit 0; fi
          if command -v apt-get >/dev/null 2>&1; then
            (sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config) \
              || (apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config)
          else
            echo "::error::no cc and no apt-get on this runner — bake build-essential/gcc into the orochi-runners image"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure C toolchain (cc) — the self-hosted orochi-runners image ships no gcc
        shell: bash
        run: |
          if command -v cc >/dev/null 2>&1; then echo "cc already present"; exit 0; fi
          if command -v apt-get >/dev/null 2>&1; then
            (sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config) \
              || (apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config)
          else
            echo "::error::no cc and no apt-get on this runner — bake build-essential/gcc into the orochi-runners image"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - run: cargo bench --workspace --no-run --all-features
