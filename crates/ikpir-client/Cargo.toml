[package]
name        = "ikpir-client"
description = "Client-side IKPIR protocol: PIR query construction, response decoding, incremental hint sync"
keywords    = ["pir", "keyword-pir", "frodopir", "lwe", "incremental"]
categories  = ["cryptography", "data-structures"]
readme      = "README.md"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
license.workspace      = true
publish.workspace      = true

autobenches = false

[lints]
workspace = true

[features]
# Forward the perf branch's parallel-kernels feature (default-on). The
# `ikpir-server` arm is what keeps the client benches' server-side setup
# preamble multi-threaded — it is a dev-dependency, so nothing here
# reaches a downstream consumer's build.
default  = ["parallel"]
parallel = ["ikpir-common/parallel", "ikpir-server/parallel"]

[dependencies]
segmented-cuckoo = { workspace = true }
ikpir-common     = { workspace = true }

[dev-dependencies]
ikpir-server = { workspace = true }
proptest     = { workspace = true }
clap         = { workspace = true }
criterion    = { workspace = true }

[[bench]]
name    = "client_query"
harness = false

[[bench]]
name    = "client_decode"
harness = false

[[bench]]
name    = "client_mutation"
harness = false

[[bench]]
name    = "headtohead_query"
harness = false

[[bench]]
name    = "headtohead_decode"
harness = false
