[package]
name        = "segmented-cuckoo-filter"
description = "Cuckoo filter variants with k-ary partial-key hashing and segmented bucket layout"
keywords    = ["cuckoo", "filter", "probabilistic", "membership", "segmented"]
categories  = ["data-structures", "algorithms"]
readme      = "README.md"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
license.workspace      = true

autobenches = false

[lints]
workspace = true

[dependencies]
xxhash-rust = { workspace = true }
rand        = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name    = "load_factor"
harness = false

[[bench]]
name    = "insert_throughput"
harness = false

[[bench]]
name    = "lookup_throughput"
harness = false

[[bench]]
name    = "fpr"
harness = false

[[bench]]
name    = "eviction"
harness = false

[[bench]]
name    = "degree_distribution"
harness = false

[[bench]]
name    = "delete_throughput"
harness = false
