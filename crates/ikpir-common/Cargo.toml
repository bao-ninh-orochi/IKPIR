[package]
name        = "ikpir-common"
description = "Shared IKPIR primitives: backend traits, FrodoPIR backend, wire bundles, and the IkpirError enum"
keywords    = ["pir", "keyword-pir", "frodopir", "lwe"]
categories  = ["cryptography", "data-structures"]
readme      = "README.md"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
license.workspace      = true
publish.workspace      = true

autobenches = false

[lints]
workspace = true

[dependencies]
segmented-cuckoo = { workspace = true }
rand             = { workspace = true }
rand_chacha      = { workspace = true }
rayon            = { workspace = true, optional = true }

[features]
# perf/optimized branch: rayon-parallel kernels (matvec, GEMM, sampling,
# hint patches). Default-on here; disable with --no-default-features for
# single-threaded runs comparable to main.
default  = ["parallel"]
parallel = ["dep:rayon"]

[[bench]]
name    = "kernels"
harness = false
