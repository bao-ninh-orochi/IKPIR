[package]
name        = "segmented-cuckoo"
description = "Segmented Cuckoo Filter and key-value store primitives for Incremental Keyword PIR"
keywords    = ["cuckoo", "probabilistic", "membership", "segmented", "pir"]
categories  = ["data-structures", "algorithms"]
readme      = "README.md"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
license.workspace      = true
publish.workspace      = true

autobenches = false

[lints]
workspace = true

[dependencies]
xxhash-rust = { workspace = true }
rand        = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

